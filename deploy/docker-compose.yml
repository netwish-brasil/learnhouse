name: learnhouse

services:
  # PostgreSQL Database with pgvector
  db:
    image: ankane/pgvector:latest
    container_name: learnhouse-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-learnhouse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-learnhouse}
      - POSTGRES_DB=${POSTGRES_DB:-learnhouse}
    volumes:
      - learnhouse_db_data:/var/lib/postgresql/data
    networks:
      - learnhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse}"]
      interval: 5s
      timeout: 4s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2.3-alpine
    container_name: learnhouse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - learnhouse_redis_data:/data
    networks:
      - learnhouse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

  # LearnHouse App (Web + API + Collab)
  learnhouse-app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        LEARNHOUSE_PUBLIC: "false"
    image: learnhouse:ee
    container_name: learnhouse-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_API_URL=http://localhost:9000
      - LEARNHOUSE_COOKIE_DOMAIN=localhost
      - LEARNHOUSE_SQL_CONNECTION_STRING=postgresql://${POSTGRES_USER:-learnhouse}:${POSTGRES_PASSWORD:-learnhouse}@db:5432/${POSTGRES_DB:-learnhouse}
      - LEARNHOUSE_REDIS_CONNECTION_STRING=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnhouse-network
    ports:
      - "80:80"
      - "9000:9000"
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  learnhouse-network:
    driver: bridge

volumes:
  learnhouse_db_data:
  learnhouse_redis_data:
